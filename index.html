<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priv Kurye - Hızlı Paket Gönder</title>
    <!-- Ücretsiz Harita Kütüphanesi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* PRİV KURYE LOGO ALANI */
        .brand-header {
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .brand-header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 51, 102, 0.15) 0%, transparent 60%);
            animation: rotateBg 15s linear infinite;
        }
        @keyframes rotateBg { 100% { transform: rotate(360deg); } }

        .logo-svg {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            animation: floatLogo 3s ease-in-out infinite;
            filter: drop-shadow(0px 5px 10px rgba(255, 51, 102, 0.4));
        }
        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .brand-title {
            margin: 0;
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff3366, #ff9933, #00c6ff);
            background-size: 200% auto;
            color: #000;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 3s linear infinite;
        }
        @keyframes shineText { to { background-position: 200% center; } }

        .brand-subtitle {
            color: #e0e0e0;
            margin: 8px 0 0 0;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* UYARI PENCERESİ (MODAL) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-content {
            background: white; padding: 25px 20px; border-radius: 12px;
            width: 85%; max-width: 400px; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-top: 0; color: #ff3366; font-size: 1.5rem; }
        .modal-content p { font-size: 1.1rem; color: #333; line-height: 1.5; }
        .btn-modal {
            background-color: #007bff; color: white; border: none; font-weight: bold;
            font-size: 1.2rem; margin-top: 15px; cursor: pointer; padding: 12px;
            border-radius: 8px; width: 100%;
        }

        /* FORM VE HARİTA STİLLERİ */
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 1.1rem; color: #444; }
        .sub-label { font-size: 1.05rem; color: #007bff; margin-top: 8px; font-weight: bold; display: block; }
        input, select, textarea, button { width: 100%; padding: 14px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.1rem; box-sizing: border-box; }
        textarea { resize: vertical; font-family: inherit; }
        .map { height: 250px; margin-top: 10px; border-radius: 8px; border: 2px solid #ccc; z-index: 1; }
        
        .autocomplete-container { position: relative; }
        .autocomplete-list { position: absolute; z-index: 1000; background: white; width: 100%; border: 1px solid #ccc; border-radius: 0 0 8px 8px; max-height: 250px; overflow-y: auto; margin: 0; padding: 0; list-style: none; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .autocomplete-list li { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 1rem; }
        .autocomplete-list li:hover { background-color: #f8f9fa; }
        .autocomplete-list li strong { color: #007bff; display: block; margin-bottom: 3px; }
        .autocomplete-list li small { color: #666; display: block; line-height: 1.2; }

        .btn-location { background-color: #e9ecef; color: #333; border: 1px solid #ccc; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-location:hover { background-color: #dee2e6; }
        
        /* WHATSAPP BUTONU (Net Yönlendirme) */
        .btn-submit { 
            background-color: #25D366; 
            color: white; 
            border: none; 
            font-weight: bold; 
            font-size: 1.2rem; 
            margin-top: 20px; 
            cursor: pointer; 
            padding: 18px; 
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); 
            transition: transform 0.2s; 
        }
        .btn-submit:hover { background-color: #20bd5a; transform: scale(1.02); }
        
        .selected-address-box { background-color: #e3f2fd; color: #0d47a1; padding: 12px; border-radius: 8px; margin-top: 10px; font-weight: bold; font-size: 1rem; border: 1px solid #bbdefb; display: none; line-height: 1.4; word-wrap: break-word; }
        .status { text-align: center; font-weight: bold; margin-top: 8px; font-size: 1.1rem; color: #dc3545; }
    </style>
</head>
<body>
    <!-- BİLGİ PENCERESİ (Hata durumunda açılır) -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <h3>⚠️ Eksik Bilgi</h3>
            <p id="modalMessage"></p>
            <button class="btn-modal" onclick="closeModal()">Tamam, anladım</button>
        </div>
    </div>

    <!-- PRİV KURYE LOGO -->
    <div class="brand-header">
        <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff9933;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff3366;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff3366" flood-opacity="0.3"/>
                </filter>
            </defs>
            <circle cx="50" cy="50" r="45" fill="url(#logoGrad)" filter="url(#shadow)" />
            <text x="56" y="68" font-size="55" font-family="Arial, sans-serif" font-weight="900" font-style="italic" fill="white" text-anchor="middle">P</text>
            <path d="M 16 38 L 28 38" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
            <path d="M 12 52 L 25 52" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
            <path d="M 18 66 L 26 66" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
            <path d="M 72 26 L 82 36" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
        </svg>
        <h1 class="brand-title">Priv Kurye</h1>
        <p class="brand-subtitle">Hemen Paket Gönder</p>
    </div>

    <div class="card">
        <!-- ALINMA BÖLÜMÜ -->
        <label>1️⃣ Nereden Alınacak?</label>
        <button class="btn-location" onclick="geolocate('alinacak')">📍 Konumumu Otomatik Bul</button>
        
        <span class="sub-label">🔍 Adres Ara veya Konum Linki Yapıştır:</span>
        <div class="autocomplete-container">
            <input type="text" id="search_alinacak" oninput="searchAddress('alinacak')" placeholder="Sokak adı veya Maps linki girin...">
            <ul id="results_alinacak" class="autocomplete-list"></ul>
        </div>
        <input type="text" id="desc_alinacak" placeholder="Bina No, Daire, Açıklama (İsteğe bağlı)">
        
        <div id="selected_box_alinacak" class="selected-address-box">📍 Seçilen Adres: Bekleniyor...</div>
        <div id="map_alinacak" class="map"></div>
        <div id="status_alinacak" class="status">❌ Konum seçilmedi</div>

        <!-- TESLİM BÖLÜMÜ -->
        <label style="margin-top: 30px;">2️⃣ Nereye Teslim Edilecek?</label>
        <button class="btn-location" onclick="geolocate('teslim')">📍 Konumumu Otomatik Bul</button>
        
        <span class="sub-label">🔍 Adres Ara veya Konum Linki Yapıştır:</span>
        <div class="autocomplete-container">
            <input type="text" id="search_teslim" oninput="searchAddress('teslim')" placeholder="Sokak adı veya Maps linki girin...">
            <ul id="results_teslim" class="autocomplete-list"></ul>
        </div>
        <input type="text" id="desc_teslim" placeholder="Bina No, Daire, Açıklama (İsteğe bağlı)">
        
        <div id="selected_box_teslim" class="selected-address-box">📍 Seçilen Adres: Bekleniyor...</div>
        <div id="map_teslim" class="map"></div>
        <div id="status_teslim" class="status">❌ Konum seçilmedi</div>
    </div>

    <!-- SEÇENEKLER KARTI -->
    <div class="card">
        <label>Paket Boyutu</label>
        <select id="boyut">
            <option value="Zarf / Dosya">Zarf / Dosya</option>
            <option value="Küçük Paket">Küçük Paket</option>
            <option value="Orta Paket">Orta Paket</option>
            <option value="Büyük Paket">Büyük Paket</option>
            <option value="Büyük ve Uzun Paket">Büyük ve Uzun Paket</option>
        </select>

        <label>Paket Ağırlığı</label>
        <select id="agirlik">
            <option value="1 kg'dan az">1 kg'dan az</option>
            <option value="2 kg">2 kg</option>
            <option value="1 - 5 kg">1 - 5 kg</option>
            <option value="5 - 10 kg">5 - 10 kg</option>
            <option value="10 - 15 kg">10 - 15 kg</option>
            <option value="15 - 20 kg">15 - 20 kg</option>
            <option value="20 - 25 kg">20 - 25 kg</option>
            <option value="25 - 30 kg">25 - 30 kg</option>
            <option value="30 - 35 kg">30 - 35 kg</option>
            <option value="35 - 40 kg">35 - 40 kg</option>
            <option value="40 - 45 kg">40 - 45 kg</option>
            <option value="45 - 50 kg">45 - 50 kg</option>
            <option value="50 - 55 kg">50 - 55 kg</option>
            <option value="55 - 60 kg">55 - 60 kg</option>
            <option value="60 - 65 kg">60 - 65 kg</option>
            <option value="65 - 70 kg">65 - 70 kg</option>
            <option value="70 - 75 kg">70 - 75 kg</option>
            <option value="75 - 80 kg">75 - 80 kg</option>
            <option value="80 - 85 kg">80 - 85 kg</option>
            <option value="85 - 90 kg">85 - 90 kg</option>
            <option value="90 - 95 kg">90 - 95 kg</option>
            <option value="95 - 100 kg">95 - 100 kg</option>
        </select>

        <label>Alınma Saati</label>
        <select id="alinma_saati" onchange="toggleOzelSaat('alinma_saati', 'ozel_alinma_kutusu')">
            <option value="Standart (30dk)">Standart (30dk)</option>
            <option value="Acil (15dk)">Acil (15dk)</option>
            <option value="Özel">Özel Saat Belirle</option>
        </select>
        <input type="time" id="ozel_alinma_kutusu" style="display: none; border-color: #007bff; border-width: 2px;">

        <label>Max Teslim Saati</label>
        <select id="teslim_saati" onchange="toggleOzelSaat('teslim_saati', 'ozel_teslim_kutusu')">
            <option value="1 Saat">1 Saat</option>
            <option value="2 Saat">2 Saat</option>
            <option value="3 Saat">3 Saat</option>
            <option value="4 Saat">4 Saat</option>
            <option value="5 Saat">5 Saat</option>
            <option value="Özel">Özel Saat Belirle</option>
        </select>
        <input type="time" id="ozel_teslim_kutusu" style="display: none; border-color: #007bff; border-width: 2px;">

        <label>Ek Notlar (İsteğe bağlı)</label>
        <textarea id="genel_aciklama" rows="2" placeholder="Kuryeye iletmek istediğiniz diğer detaylar..."></textarea>

        <!-- WHATSAPP YÖNLENDİRMESİ AÇIKÇA BELİRTİLDİ -->
        <button class="btn-submit" onclick="sendToWhatsApp()">✅ WhatsApp'tan Priv Kurye Çağır</button>
    </div>

    <!-- HARİTA VE JS KODLARI -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const startLat = 41.0256;
        const startLng = 29.0963;

        let maps = {};
        let markers = { alinacak: null, teslim: null };
        let coords = { alinacak: null, teslim: null };
        let pastedLinks = { alinacak: null, teslim: null }; 
        let searchTimeouts = {};

        function showModal(message) {
            document.getElementById('modalMessage').innerHTML = message;
            document.getElementById('customModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        function initMap(type) {
            maps[type] = L.map('map_' + type).setView([startLat, startLng], 13);
            
            L.tileLayer('http://mt0.google.com/vt/lyrs=m&hl=tr&x={x}&y={y}&z={z}', {
                attribution: '© Google Haritalar',
                maxZoom: 20
            }).addTo(maps[type]);

            maps[type].on('click', function(e) {
                setMarker(type, e.latlng.lat, e.latlng.lng, true);
                reverseGeocode(type, e.latlng.lat, e.latlng.lng);
            });
        }

        initMap('alinacak');
        initMap('teslim');

        function updateSelectedBox(type, addressText) {
            const box = document.getElementById('selected_box_' + type);
            box.style.display = 'block';
            box.innerHTML = `📍 Seçilen Adres:<br><span style="color:#333; font-weight:normal; margin-top:5px; display:inline-block;">${addressText}</span>`;
            
            const statusEl = document.getElementById('status_' + type);
            statusEl.innerHTML = "✅ Konum seçildi";
            statusEl.style.color = "#28a745";
        }

        function setMarker(type, lat, lng, isClick = false) {
            // Haritaya tıklanırsa veya arama yapılırsa yapıştırılan linki iptal et
            pastedLinks[type] = null; 

            if (markers[type]) maps[type].removeLayer(markers[type]);
            markers[type] = L.marker([lat, lng]).addTo(maps[type]);
            coords[type] = { lat: lat, lng: lng };
            
            if(!isClick) {
                maps[type].flyTo([lat, lng], 17, { duration: 1.5 });
            }
            document.getElementById('map_' + type).style.borderColor = "#28a745";
        }

        function geolocate(type) {
            if (navigator.geolocation) {
                document.getElementById('status_' + type).innerHTML = "⏳ Konumunuz bulunuyor...";
                document.getElementById('status_' + type).style.color = "#666";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        setMarker(type, lat, lng, false);
                        reverseGeocode(type, lat, lng);
                    },
                    (error) => {
                        showModal("Konumunuz alınamadı. Telefonunuzun konum servislerinin açık olduğundan emin olun.");
                        document.getElementById('status_' + type).innerHTML = "❌ Konum alınamadı";
                        document.getElementById('status_' + type).style.color = "#dc3545";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                showModal("Tarayıcınız konum özelliğini desteklemiyor.");
            }
        }

        function searchAddress(type) {
            clearTimeout(searchTimeouts[type]);
            const query = document.getElementById('search_' + type).value.trim();
            const resultsContainer = document.getElementById('results_' + type);
            
            // LİNK YAPIŞTIRILDIYSA ÇALIŞACAK AKILLI BÖLÜM
            if (query.includes('http') || query.includes('goo.gl') || query.includes('maps')) {
                pastedLinks[type] = query; 
                
                // Linkin içinde koordinat varsa (örn: 41.02,29.09) haritayı oraya uçur
                const match = query.match(/(-?\d+\.\d+)[, ]+(-?\d+\.\d+)/);
                if (match) {
                    const lat = parseFloat(match[1]);
                    const lng = parseFloat(match[2]);
                    setMarker(type, lat, lng, false);
                    reverseGeocode(type, lat, lng);
                } else {
                    // Gizli kısa linkse harita hareket edemez ama işlem onaylanır
                    coords[type] = null; 
                    updateSelectedBox(type, `🔗 Hazır Konum Linki Eklendi<br><a href="${query}" target="_blank" style="font-size:0.95rem; color:#007bff; word-break: break-all;">${query}</a>`);
                    document.getElementById('map_' + type).style.borderColor = "#28a745";
                }
                resultsContainer.innerHTML = ''; 
                return;
            }

            // Normal Adres Araması
            if(query.length < 3) {
                resultsContainer.innerHTML = '';
                return;
            }

            searchTimeouts[type] = setTimeout(() => {
                const searchQuery = encodeURIComponent(query + ' İstanbul');
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${searchQuery}&limit=5&addressdetails=1`)
                    .then(res => res.json())
                    .then(data => {
                        resultsContainer.innerHTML = '';
                        data.forEach(item => {
                            const parts = item.display_name.split(', ');
                            const title = parts[0] || "Bilinmeyen Yer";
                            const subtitle = parts.slice(1, 4).join(', ') || "";
                            const fullAddress = `${title}, ${subtitle}`;
                            
                            const li = document.createElement('li');
                            li.innerHTML = `<strong>${title}</strong><small>${subtitle}</small>`;
                            
                            li.onclick = () => {
                                const lat = item.lat;
                                const lng = item.lon;
                                setMarker(type, lat, lng, false);
                                document.getElementById('search_' + type).value = fullAddress;
                                updateSelectedBox(type, fullAddress);
                                resultsContainer.innerHTML = ''; 
                            };
                            resultsContainer.appendChild(li);
                        });
                    })
                    .catch(err => console.log("Arama bekliyor..."));
            }, 800);
        }

        function reverseGeocode(type, lat, lng) {
            document.getElementById('search_' + type).value = "Adres bulunuyor...";
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`)
                .then(res => res.json())
                .then(data => {
                    let fullAddress = "Haritadan seçilen konum";
                    if (data && data.display_name) {
                        const parts = data.display_name.split(', ');
                        fullAddress = parts.slice(0, 4).join(', '); 
                    }
                    document.getElementById('search_' + type).value = fullAddress;
                    updateSelectedBox(type, fullAddress);
                })
                .catch(err => {
                    const fallback = "Haritadan seçilen konum";
                    document.getElementById('search_' + type).value = fallback;
                    updateSelectedBox(type, fallback);
                });
        }

        function toggleOzelSaat(selectId, inputId) {
            const selectValue = document.getElementById(selectId).value;
            const inputKutusu = document.getElementById(inputId);
            
            if (selectValue === "Özel") {
                inputKutusu.style.display = "block";
            } else {
                inputKutusu.style.display = "none";
                inputKutusu.value = ""; 
            }
        }

        function sendToWhatsApp() {
            const alinacakTamam = coords.alinacak || pastedLinks.alinacak;
            const teslimTamam = coords.teslim || pastedLinks.teslim;

            if (!alinacakTamam || !teslimTamam) {
                showModal("Lütfen hem <b>Alınacak</b> hem de <b>Teslim Edilecek</b> yeri haritadan seçin veya kutulara konum linki yapıştırın.");
                return;
            }

            const telefon = "905418733299";
            
            // WHATSAPP MESAJINI ÇİFT LİNK OLMADAN, TERTEMİZ OLUŞTURMA:
            const alinacakEk = document.getElementById("desc_alinacak").value.trim();
            const teslimEk = document.getElementById("desc_teslim").value.trim();
            
            let alinacakBolum = "";
            if (pastedLinks.alinacak) {
                alinacakBolum = `📍 *Konum Linki:* ${pastedLinks.alinacak}`;
            } else {
                alinacakBolum = `📍 *Adres:* ${document.getElementById("search_alinacak").value}\n📍 *Harita:* https://www.google.com/maps?q=${coords.alinacak.lat},${coords.alinacak.lng}`;
            }
            if (alinacakEk) alinacakBolum += `\n📝 *Not:* ${alinacakEk}`;

            let teslimBolum = "";
            if (pastedLinks.teslim) {
                teslimBolum = `📍 *Konum Linki:* ${pastedLinks.teslim}`;
            } else {
                teslimBolum = `📍 *Adres:* ${document.getElementById("search_teslim").value}\n📍 *Harita:* https://www.google.com/maps?q=${coords.teslim.lat},${coords.teslim.lng}`;
            }
            if (teslimEk) teslimBolum += `\n📝 *Not:* ${teslimEk}`;

            let alinmaSaati = document.getElementById("alinma_saati").value;
            if (alinmaSaati === "Özel") {
                const ozelDeger = document.getElementById("ozel_alinma_kutusu").value;
                alinmaSaati = ozelDeger ? `Özel Saat (${ozelDeger})` : "Özel Saat (Seçilmedi)";
            }

            let teslimSaati = document.getElementById("teslim_saati").value;
            if (teslimSaati === "Özel") {
                const ozelDeger = document.getElementById("ozel_teslim_kutusu").value;
                teslimSaati = ozelDeger ? `Özel Saat (${ozelDeger})` : "Özel Saat (Seçilmedi)";
            }

            const genelNot = document.getElementById("genel_aciklama").value.trim();
            const notBolumu = genelNot ? `\n\n📌 *EK NOTLAR:*\n${genelNot}` : "";

            const mesaj = `📦 *PRİV KURYE TALEBİ*\n\n` +
                          `🟢 *ALINACAK YER:*\n${alinacakBolum}\n\n` +
                          `🔴 *TESLİM EDİLECEK YER:*\n${teslimBolum}\n\n` +
                          `📏 *Boyut:* ${document.getElementById("boyut").value}\n` +
                          `⚖️ *Ağırlık:* ${document.getElementById("agirlik").value}\n` +
                          `🕒 *Alınma Zamanı:* ${alinmaSaati}\n` +
                          `🏁 *Max Teslim Saati:* ${teslimSaati}` + 
                          notBolumu;

            window.open(`https://wa.me/${telefon}?text=${encodeURIComponent(mesaj)}`, '_blank');
        }
    </script>
</body>
</html>
