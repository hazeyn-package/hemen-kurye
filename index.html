<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurye Çağır</title>
    <!-- Ücretsiz Harita Kütüphanesi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 1.1rem; color: #444; }
        input, select, button { width: 100%; padding: 14px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.1rem; box-sizing: border-box; }
        .map { height: 250px; margin-top: 10px; border-radius: 8px; border: 2px solid #ccc; z-index: 1; }
        
        /* Arama Önerileri İçin Dropdown Tasarımı */
        .autocomplete-container { position: relative; }
        .autocomplete-list { position: absolute; z-index: 1000; background: white; width: 100%; border: 1px solid #ccc; border-radius: 0 0 8px 8px; max-height: 250px; overflow-y: auto; margin: 0; padding: 0; list-style: none; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .autocomplete-list li { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 1rem; }
        .autocomplete-list li:hover { background-color: #f8f9fa; }
        .autocomplete-list li strong { color: #007bff; display: block; margin-bottom: 3px; }
        .autocomplete-list li small { color: #666; display: block; line-height: 1.2; }

        .btn-location { background-color: #e9ecef; color: #333; border: 1px solid #ccc; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-location:hover { background-color: #dee2e6; }
        .btn-submit { background-color: #25D366; color: white; border: none; font-weight: bold; font-size: 1.3rem; margin-top: 20px; cursor: pointer; padding: 16px; }
        .btn-submit:hover { background-color: #1ebe5d; }
        
        /* Seçilen Adres Kutusu */
        .selected-address-box { background-color: #e3f2fd; color: #0d47a1; padding: 12px; border-radius: 8px; margin-top: 10px; font-weight: bold; font-size: 1rem; border: 1px solid #bbdefb; display: none; line-height: 1.4; }
        
        .status { text-align: center; font-weight: bold; margin-top: 8px; font-size: 1rem; color: #dc3545; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📦 Kurye Talep Formu</h2>
        
        <!-- ALINMA BÖLÜMÜ -->
        <label>1️⃣ Nereden Alınacak?</label>
        <button class="btn-location" onclick="geolocate('alinacak')">📍 Konumumu Otomatik Bul</button>
        <div class="autocomplete-container">
            <input type="text" id="search_alinacak" oninput="searchAddress('alinacak')" placeholder="Sokak veya mahalle yazın (Örn: Şiir Sokak)">
            <ul id="results_alinacak" class="autocomplete-list"></ul>
        </div>
        <input type="text" id="desc_alinacak" placeholder="Bina No, Daire, Açıklama (İsteğe bağlı)">
        
        <div id="selected_box_alinacak" class="selected-address-box">📍 Seçilen Adres: Bekleniyor...</div>
        <div id="map_alinacak" class="map"></div>
        <div id="status_alinacak" class="status">❌ Haritadan konum seçilmedi</div>

        <!-- TESLİM BÖLÜMÜ -->
        <label style="margin-top: 30px;">2️⃣ Nereye Teslim Edilecek?</label>
        <button class="btn-location" onclick="geolocate('teslim')">📍 Konumumu Otomatik Bul</button>
        <div class="autocomplete-container">
            <input type="text" id="search_teslim" oninput="searchAddress('teslim')" placeholder="Sokak veya mahalle yazın (Örn: Atatürk Mah)">
            <ul id="results_teslim" class="autocomplete-list"></ul>
        </div>
        <input type="text" id="desc_teslim" placeholder="Bina No, Daire, Açıklama (İsteğe bağlı)">
        
        <div id="selected_box_teslim" class="selected-address-box">📍 Seçilen Adres: Bekleniyor...</div>
        <div id="map_teslim" class="map"></div>
        <div id="status_teslim" class="status">❌ Haritadan konum seçilmedi</div>
    </div>

    <div class="card">
        <label>Paket Boyutu</label>
        <select id="boyut">
            <option value="Zarf / Dosya">Zarf / Dosya</option>
            <option value="Küçük Kutu">Küçük Kutu (Ayakkabı Kutusu)</option>
            <option value="Orta/Büyük Kutu">Orta/Büyük Kutu</option>
        </select>

        <label>Paket Ağırlığı (kg)</label>
        <select id="agirlik">
            <option value="1 kg'dan az">1 kg'dan az</option>
            <option value="1 - 5 kg arası">1 - 5 kg arası</option>
            <option value="5 - 10 kg arası">5 - 10 kg arası</option>
        </select>

        <label>Alınma Saati</label>
        <select id="alinma_saati">
            <option value="Şimdi">Şimdi</option>
            <option value="1 Saat İçinde">1 Saat İçinde</option>
        </select>

        <label>Max Teslim Saati</label>
        <select id="teslim_saati">
            <option value="Fark etmez (Gün içi)">Fark etmez (Gün içi)</option>
            <option value="En geç 1 saat içinde">En geç 1 saat içinde</option>
            <option value="En geç 2 saat içinde">En geç 2 saat içinde</option>
        </select>

        <button class="btn-submit" onclick="sendToWhatsApp()">✅ WhatsApp'tan Gönder</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Ümraniye merkezli başlangıç koordinatları
        const startLat = 41.0256;
        const startLng = 29.0963;

        let maps = {};
        let markers = { alinacak: null, teslim: null };
        let coords = { alinacak: null, teslim: null };
        let searchTimeouts = {};

        // Haritaları Başlatma
        function initMap(type) {
            maps[type] = L.map('map_' + type).setView([startLat, startLng], 13);
            
            // Google Haritalar Görünümü
            L.tileLayer('http://mt0.google.com/vt/lyrs=m&hl=tr&x={x}&y={y}&z={z}', {
                attribution: '© Google Haritalar',
                maxZoom: 20
            }).addTo(maps[type]);

            // Haritaya tıklayınca
            maps[type].on('click', function(e) {
                setMarker(type, e.latlng.lat, e.latlng.lng, true);
                reverseGeocode(type, e.latlng.lat, e.latlng.lng);
            });
        }

        initMap('alinacak');
        initMap('teslim');

        // Mavi Kutu Güncelleme (Seçilen Adres)
        function updateSelectedBox(type, addressText) {
            const box = document.getElementById('selected_box_' + type);
            box.style.display = 'block';
            box.innerHTML = `📍 Haritadaki Adres:<br><span style="color:#333; font-weight:normal; margin-top:5px; display:inline-block;">${addressText}</span>`;
            document.getElementById('status_' + type).style.display = 'none'; // Hata mesajını gizle
        }

        // İşaretçi Koyma ve Haritayı Kaydırma (Animasyon)
        function setMarker(type, lat, lng, isClick = false) {
            if (markers[type]) maps[type].removeLayer(markers[type]);
            markers[type] = L.marker([lat, lng]).addTo(maps[type]);
            coords[type] = { lat: lat, lng: lng };
            
            // Eğer listeden seçildiyse harita animasyonla oraya uçsun
            if(!isClick) {
                maps[type].flyTo([lat, lng], 17, { duration: 1.5 });
            }
            
            document.getElementById('map_' + type).style.borderColor = "#28a745";
        }

        // Otomatik Konum Bulma (GPS)
        function geolocate(type) {
            if (navigator.geolocation) {
                document.getElementById('status_' + type).innerHTML = "⏳ Konumunuz bulunuyor...";
                document.getElementById('status_' + type).style.display = 'block';
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        setMarker(type, lat, lng, false);
                        reverseGeocode(type, lat, lng);
                    },
                    (error) => {
                        alert("Konum alınamadı. Lütfen telefonunuzun konum servislerinin açık olduğundan emin olun veya haritadan kendiniz seçin.");
                        document.getElementById('status_' + type).innerHTML = "❌ Konum alınamadı";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Tarayıcınız konum özelliğini desteklemiyor.");
            }
        }

        // YENİ: Adres Arama (Resmi Nominatim API ile Kararlı Arama)
        function searchAddress(type) {
            clearTimeout(searchTimeouts[type]);
            const query = document.getElementById('search_' + type).value;
            const resultsContainer = document.getElementById('results_' + type);
            
            if(query.length < 3) {
                resultsContainer.innerHTML = '';
                return;
            }

            searchTimeouts[type] = setTimeout(() => {
                // İstanbul ve Türkiye odaklı arama yapıyoruz ki sonuçlar saçmalamasın
                const searchQuery = encodeURIComponent(query + ' İstanbul');
                
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${searchQuery}&limit=5&addressdetails=1`)
                    .then(res => res.json())
                    .then(data => {
                        resultsContainer.innerHTML = '';
                        data.forEach(item => {
                            // Uzun adres metnini virgüllerden bölüp daha temiz gösteriyoruz
                            const parts = item.display_name.split(', ');
                            const title = parts[0] || "Bilinmeyen Yer";
                            const subtitle = parts.slice(1, 4).join(', ') || "";
                            const fullAddress = `${title}, ${subtitle}`;
                            
                            const li = document.createElement('li');
                            li.innerHTML = `<strong>${title}</strong><small>${subtitle}</small>`;
                            
                            // Kullanıcı menüden adres seçtiğinde:
                            li.onclick = () => {
                                const lat = item.lat;
                                const lng = item.lon;
                                
                                setMarker(type, lat, lng, false);
                                document.getElementById('search_' + type).value = fullAddress;
                                updateSelectedBox(type, fullAddress);
                                resultsContainer.innerHTML = ''; 
                            };
                            resultsContainer.appendChild(li);
                        });
                    })
                    .catch(err => console.error("Arama servisi geçici olarak yanıt vermiyor."));
            }, 800); // Sistemi yormamak için bekleyiş süresi
        }

        // YENİ: Tıklanan Yerin Adresini Çözümleme (Nominatim API - Boş kalmaz)
        function reverseGeocode(type, lat, lng) {
            document.getElementById('search_' + type).value = "Adres bulunuyor...";
            
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`)
                .then(res => res.json())
                .then(data => {
                    let fullAddress = "Haritadan seçilen konum";
                    
                    if (data && data.display_name) {
                        // Türkiye ve Posta kodu gibi gereksiz detayları metinden kırpalım
                        const parts = data.display_name.split(', ');
                        fullAddress = parts.slice(0, 4).join(', '); 
                    }
                    
                    document.getElementById('search_' + type).value = fullAddress;
                    updateSelectedBox(type, fullAddress);
                })
                .catch(err => {
                    // API anlık yanıt vermezse metin kutusu boş kalmasın diye varsayılan değer
                    const fallback = "Haritadan seçilen konum";
                    document.getElementById('search_' + type).value = fallback;
                    updateSelectedBox(type, fallback);
                });
        }

        // WhatsApp'a Gönder
        function sendToWhatsApp() {
            if (!coords.alinacak || !coords.teslim) {
                alert("Lütfen hem alınacak hem de teslim edilecek konumu haritadan veya listeden seçin!");
                return;
            }

            const telefon = "905418733299";
            
            const alinacakIsim = document.getElementById("search_alinacak").value || "Haritadan Seçildi";
            const alinacakEk = document.getElementById("desc_alinacak").value.trim();
            const teslimIsim = document.getElementById("search_teslim").value || "Haritadan Seçildi";
            const teslimEk = document.getElementById("desc_teslim").value.trim();
            
            const mapAlinacak = `https://www.google.com/maps?q=${coords.alinacak.lat},${coords.alinacak.lng}`;
            const mapTeslim = `https://www.google.com/maps?q=${coords.teslim.lat},${coords.teslim.lng}`;

            const alinacakMetin = alinacakEk ? `${alinacakIsim}\n📝 *Not:* ${alinacakEk}` : alinacakIsim;
            const teslimMetin = teslimEk ? `${teslimIsim}\n📝 *Not:* ${teslimEk}` : teslimIsim;

            const mesaj = `📦 *YENİ KURYE TALEBİ*\n\n` +
                          `🟢 *ALINACAK YER:*\n${alinacakMetin}\n📍 Konum: ${mapAlinacak}\n\n` +
                          `🔴 *TESLİM EDİLECEK YER:*\n${teslimMetin}\n📍 Konum: ${mapTeslim}\n\n` +
                          `📏 *Boyut:* ${document.getElementById("boyut").value}\n` +
                          `⚖️ *Ağırlık:* ${document.getElementById("agirlik").value}\n` +
                          `🕒 *Alınma Zamanı:* ${document.getElementById("alinma_saati").value}\n` +
                          `🏁 *Max Teslim Saati:* ${document.getElementById("teslim_saati").value}`;

            window.open(`https://wa.me/${telefon}?text=${encodeURIComponent(mesaj)}`, '_blank');
        }
    </script>
</body>
</html>
